<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Gestión Global de Entidades</title>
  <link rel="stylesheet" href="css/cajero.css">
  
  <style>
    /* Estilos para los filtros/pestañas del panel admin */
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 16px;
      border: 1px solid #cbd5e0;
      background-color: #edf2f7;
      color: #2d3748;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background-color: #3182ce;
      color: white;
      border-color: #3182ce;
    }
    .table-container {
      overflow-x: auto;
    }
    .badge-rol {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-alumno { background: #ebf8ff; color: #2b6cb0; }
    .badge-cajero { background: #feebc8; color: #c05621; }
    .badge-admin  { background: #fed7d7; color: #9b2c2c; }
    .badge-posnet { background: #e6fffa; color: #234e52; }
  </style>
</head>
<body>

  <div id="navbar-container"></div>

  <main class="dashboard-container">
    <section class="card" style="max-width: 1100px; margin: 0 auto;">
      <h2>👥 Directorio General de Usuarios y Dispositivos</h2>
      <p class="text-subtitle" style="margin-bottom: 20px;">
        Visualizá todos los perfiles, tarjetas vinculadas, saldos y roles del sistema.
      </p>

      <!-- BARRA DE BÚSQUEDA Y FILTROS -->
      <div style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
        <input type="text" id="txtBuscarGlobal" placeholder="🔍 Buscar por nombre, DNI, usuario, serie..." style="flex: 1; min-width: 250px;">
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" onclick="filtrarEntidad('TODOS', this)">🌐 Todos</button>
        <button class="filter-btn" onclick="filtrarEntidad('ALUMNOS', this)">👨‍🎓 Alumnos</button>
        <button class="filter-btn" onclick="filtrarEntidad('CAJEROS', this)">🏦 Cajeros</button>
        <button class="filter-btn" onclick="filtrarEntidad('POSNETS', this)">📱 POSNETs</button>
        <button class="filter-btn" onclick="filtrarEntidad('ADMINS', this)">🔑 Admins</button>
      </div>

      <!-- TABLA GENERAL -->
      <div class="table-container">
        <table class="tabla-datos" style="width: 100%; border-collapse: collapse;">
          <thead>
            <tr style="border-bottom: 2px solid #e2e8f0; text-align: left;">
              <th style="padding: 10px;">Tipo / Rol</th>
              <th style="padding: 10px;">Identificador / DNI</th>
              <th style="padding: 10px;">Nombre / Descripción</th>
              <th style="padding: 10px;">Curso / Stand</th>
              <th style="padding: 10px;">Saldo / Estado</th>
              <th style="padding: 10px;">Cód. QR / ID</th>
            </tr>
          </thead>
          <tbody id="tblEntidades">
            <tr>
              <td colspan="6" style="text-align: center; padding: 20px;">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- LIBRERÍAS Y SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/admin-alumnos.js"></script>
</body>
</html>
