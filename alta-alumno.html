<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Enrolamiento de Tarjeta</title>
  <link rel="stylesheet" href="css/index.css">
  <!-- Librería gratuita para leer QR desde la cámara -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <div class="login-card" style="max-width: 500px;">
    <div class="login-header">
      <h2>Asociar Tarjeta a Alumno 💳</h2>
      <p>Escaneá la tarjeta y completá los datos</p>
    </div>

    <form id="formAltaCajero">
      
      <!-- Paso 1: Código de Tarjeta con botón de Escáner -->
      <div class="form-group" style="background: #ebf8ff; padding: 12px; border-radius: 8px; border: 1px solid #bee3f8;">
        <label for="txtCodigoQR" style="color: #2b6cb0;">1. Código / QR de la Tarjeta</label>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
          <input type="text" id="txtCodigoQR" placeholder="Escribí o escaneá..." required autofocus style="flex: 1;">
          <button type="button" id="btnEscanearQR" class="btn-submit" style="width: auto; margin-top: 0; background: #2b6cb0; padding: 0 12px;">📷 Leer QR</button>
        </div>
      </div>

      <!-- Paso 2: Datos del Alumno -->
      <div class="form-group">
        <label for="txtDni">DNI del Alumno</label>
        <input type="text" id="txtDni" placeholder="Ej: 45123456" required>
      </div>

      <div class="form-group">
        <label for="txtNombre">Nombre y Apellido</label>
        <input type="text" id="txtNombre" placeholder="Ej: Lucas Gómez" required>
      </div>

      <div class="form-group">
        <label for="txtCurso">Curso / Grado</label>
        <input type="text" id="txtCurso" placeholder="Ej: 5to 2da" required>
      </div>

      <!-- Captura de Foto -->
      <div class="form-group" style="text-align: center;">
        <label>Foto del Alumno</label>
        <div style="margin: 8px 0;">
          <img id="imgPreview" src="" alt="Vista Previa" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #cbd5e0; background: #edf2f7;">
        </div>
        <button type="button" id="btnAbrirCamara" class="btn-submit" style="background-color: #4a5568; margin-top: 0; padding: 8px;">📸 Tomar Foto Perfil</button>
      </div>

      <!-- Paso 3: PIN Secreto -->
      <div class="form-group" style="background: #fffaf0; padding: 12px; border-radius: 8px; border: 1px solid #feebc8; margin-top: 15px;">
        <label for="txtPin" style="color: #c05621;">🔒 Entregar teclado al Alumno (PIN de 4 dígitos)</label>
        <input type="password" id="txtPin" maxlength="4" placeholder="****" required style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
      </div>

      <div id="msgAlta" class="error-message"></div>

      <button type="submit" id="btnGuardar" class="btn-submit" style="background-color: #2b6cb0; margin-top: 15px;">
         Registrar y Vincular Tarjeta
      </button>
    </form>
  </div>

  <!-- Modal para la Cámara del Perfil -->
  <div id="modalCamara" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index: 1000;">
    <div style="background:white; padding:1.5rem; border-radius:12px; text-align:center; max-width:380px; width:90%;">
      <h3>Capturar Foto de Perfil</h3>
      <video id="webcam" autoplay playsinline style="width: 100%; border-radius: 8px; background: #000; margin: 10px 0;"></video>
      <canvas id="canvasFoto" style="display:none;"></canvas>
      <div style="display: flex; gap: 10px;">
        <button id="btnCapturar" class="btn-submit" style="background:#38a169;">📷 Capturar</button>
        <button id="btnCerrarCamara" class="btn-submit" style="background:#e53e3e;">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal para Lector de QR -->
  <div id="modalLectorQR" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index: 1000;">
    <div style="background:white; padding:1.5rem; border-radius:12px; text-align:center; max-width:380px; width:90%;">
      <h3>Escanear Código QR</h3>
      <p style="font-size:0.85rem; color:#718096; margin-bottom:10px;">Apunta la cámara al QR de la tarjeta</p>
      
      <!-- Visor de Html5Qrcode -->
      <div id="reader" style="width: 100%;"></div>

      <button id="btnCerrarLectorQR" class="btn-submit" style="background:#e53e3e; margin-top: 10px;">Cancelar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/alta-alumno.js"></script>
</body>
</html>
