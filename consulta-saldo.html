<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Saldo - Banco Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0d1b2a, #1b263b);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .card-kiosk {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            margin-top: 15px;
            border: 2px solid #00d2ff;
        }

        .avatar-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #00d2ff;
            margin-bottom: 10px;
        }

        .saldo-badge {
            font-size: 3rem;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }
    </style>
</head>

<body>

    <div class="card-kiosk">
        <!-- LOGO O TITULO DEL BANCO -->
        <div class="mb-3">
            <h3 class="fw-bold text-info m-0">🏦 BANCO ESCOLAR</h3>
            <p class="text-muted small">Terminal de Consulta de Saldo</p>
        </div>

        <!-- ESTADO ESPERA (CÁMARA LEYENDO) -->
        <div id="viewScan">
            <div id="reader"></div>
            <div class="alert alert-dark border-info text-info mt-3 fs-5 fw-semibold mb-0">
                📲 Acerque su tarjeta QR para consultar
            </div>
        </div>

        <!-- ESTADO RESULTADO EXITO (MUESTRA SALDO) -->
        <div id="viewResult" class="d-none">
            <img id="resFoto" src="" class="avatar-img shadow" alt="Foto Alumno">
            <h3 id="resNombre" class="fw-bold mb-1">Nombre Alumno</h3>
            <p id="resCurso" class="text-info fs-5 mb-2">Curso</p>
            <div class="my-3">
                <small class="text-uppercase text-muted fw-bold">Saldo Disponible</small>
                <div id="resSaldo" class="saldo-badge">$ 0.00</div>
            </div>
            <div class="progress mt-3" style="height: 6px;">
                <div id="progressBar" class="progress-bar bg-info progress-bar-striped progress-bar-animated"
                    style="width: 100%;"></div>
            </div>
        </div>

        <!-- ESTADO ERROR (TARJETA NO REGISTRADA) -->
        <div id="viewError" class="d-none py-4">
            <div class="display-1 text-danger mb-2">⚠️</div>
            <h3 class="fw-bold text-danger mb-2">Tarjeta no registrada</h3>
            <p class="text-muted fs-5 mb-4">El código QR escaneado no pertenece a ningún usuario del sistema.</p>
            <div class="progress mt-3" style="height: 6px;">
                <div id="progressBarError" class="progress-bar bg-danger progress-bar-striped progress-bar-animated"
                    style="width: 100%;"></div>
            </div>
        </div>

    </div>

    <!-- 1. CDN Oficial de Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Tu archivo de cliente Supabase -->
    <script src="js/supabaseClient.js"></script>
    <!-- 3. Tu lógica de Login -->
    <script src="js/consulta-saldo.js"></script>


</body>

</html>
