<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Login</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h2>Banco Escolar</h2>
      <p>Ingresá tus credenciales para acceder</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Ej: admin" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <button type="submit" id="btnsubmit" class="btn-submit">Ingresar</button>
    </form>
  </div>

  <!-- 1. CDN Oficial de Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 2. Tu archivo de cliente Supabase -->
  <script src="js/supabaseClient.js"></script>
  <!-- 3. Tu lógica de Login -->
  <script src="js/index.js"></script>
</body>
</html>
