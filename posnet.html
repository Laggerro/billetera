<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POSNET Web - Terminal de Venta</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="css/posnet.css">

    <!-- Supabase & HTML5 QrCode SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div class="container-fluid py-3">
        <!-- ENCABEZADO CON MÉTRICAS -->
        <div
            class="d-flex justify-content-between align-items-center mb-3 px-3 bg-dark p-2 rounded border border-secondary">
            <div>
                <h5 class="m-0 text-warning" id="posnetNombre">🏪 Cargando POSNET...</h5>
                <small class="text-muted" id="posnetUsuario">Cajero: -</small>
            </div>
            <div class="d-flex gap-3 text-end">
                <div>
                    <small class="text-muted d-block">VENTAS</small>
                    <h4 class="m-0 text-info fw-bold" id="cantVentas">0</h4>
                </div>
                <div>
                    <small class="text-muted d-block">RECAUDADO</small>
                    <h4 class="m-0 text-success fw-bold" id="montoAcumulado">$ 0</h4>
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="row g-3">
            <!-- CÁMARA Y ESTADO -->
            <div class="col-md-6">
                <div class="card-posnet p-3 text-center">
                    <label class="form-label text-muted mb-2">📷 Escáner de Tarjetas</label>
                    <div id="reader"></div>
                    <div id="statusBox" class="status-bar alert-secondary mt-3">
                        🟡 Ingrese el monto a cobrar
                    </div>
                </div>
            </div>

            <!-- DISPLAY Y TECLADO NUMÉRICO -->
            <div class="col-md-6">
                <div class="card-posnet p-3">
                    <label class="form-label text-muted mb-1">Monto a Cobrar</label>
                    <div class="display-monto mb-3" id="displayMonto">$ 0</div>

                    <div class="row g-2 mb-2">
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('7')">7</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('8')">8</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('9')">9</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('4')">4</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('5')">5</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('6')">6</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('1')">1</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('2')">2</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('3')">3</button></div>
                        <div class="col-4"><button class="btn btn-danger w-100 fw-bold py-3"
                                onclick="clearKeypad()">C</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('0')">0</button></div>
                        <div class="col-4"><button class="btn btn-keypad w-100" onclick="pressKey('00')">00</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN CON PIN Y FOTO -->
    <div class="modal fade" id="modalPin" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">🔐 Validar Transacción</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="cancelarPago()"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalAlumnoFoto" src="" class="avatar-modal mb-2" alt="Foto Alumno">
                    <h4 class="text-warning mb-1" id="modalAlumnoNombre">Cargando...</h4>
                    <h3 class="text-success mb-3" id="modalMontoCobrar">$ 0</h3>
                    <input type="password" id="inputPin"
                        class="form-control form-control-lg text-center fs-2 bg-black text-warning border-secondary mb-3"
                        maxlength="4" placeholder="****" inputmode="numeric">
                    <button class="btn btn-success btn-lg w-100 fw-bold fs-4" onclick="confirmarPago()">CONFIRMAR
                        PAGO</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


    <!-- 1. CDN Oficial de Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Tu archivo de cliente Supabase -->
    <script src="js/supabaseClient.js"></script>
    <!-- 3. Tu lógica de Login -->

    <script src="js/posnet.js"></script>
</body>

</html>
