<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POSNET Web - Terminal de Venta</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos Propios -->
    <link rel="stylesheet" href="css/posnet.css">

    <!-- Supabase & HTML5 QrCode SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

    <div class="container-fluid py-3" style="max-width: 600px; margin: 0 auto;">
        <!-- ENCABEZADO CON MÉTRICAS -->
        <div
            class="d-flex justify-content-between align-items-center mb-3 px-3 bg-dark p-2 rounded border border-secondary text-white">
            <div>
                <h5 class="m-0 text-warning" id="posnetNombre">🏪 Cargando POSNET...</h5>
                <small class="text-muted" id="posnetUsuario">Cajero: -</small>
            </div>
            <div class="d-flex gap-3 text-end">
                <div>
                    <small class="text-muted d-block">VENTAS</small>
                    <h4 class="m-0 text-info fw-bold" id="cantVentas">0</h4>
                </div>
                <div>
                    <small class="text-muted d-block">RECAUDADO</small>
                    <h4 class="m-0 text-success fw-bold" id="montoAcumulado">$ 0</h4>
                </div>
            </div>
        </div>

        <!-- ESTADO DE LA OPERACIÓN -->
        <div id="statusBox" class="status-bar alert alert-secondary text-center fw-bold mb-3" role="alert">
            🟡 Ingrese el monto a cobrar
        </div>

        <!-- DISPLAY Y TECLADO NUMÉRICO (CENTRALIZADO PARA MÓVILES) -->
        <div class="card-posnet p-3 bg-dark rounded border border-secondary">
            <label class="form-label text-muted mb-1 fs-6">Monto a Cobrar</label>
            <div class="display-monto mb-3 text-center fw-bold fs-1 text-success bg-black p-3 rounded border border-secondary"
                id="displayMonto">$ 0</div>

            <div class="row g-2 mb-3">
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('7')">7</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('8')">8</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('9')">9</button></div>

                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('4')">4</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('5')">5</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('6')">6</button></div>

                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('1')">1</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('2')">2</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('3')">3</button></div>

                <div class="col-4"><button class="btn btn-danger w-100 fw-bold py-3 fs-3"
                        onclick="clearKeypad()">C</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('0')">0</button></div>
                <div class="col-4"><button class="btn btn-keypad w-100 py-3 fs-3 btn-outline-light"
                        onclick="pressKey('00')">00</button></div>
            </div>

            <!-- BOTÓN PRINCIPAL PARA INICIAR EL COBRO -->
            <button class="btn btn-success btn-lg w-100 py-3 fw-bold fs-3" onclick="iniciarCobro()">
                📷 COBRAR
            </button>
        </div>
    </div>

    <!-- MODAL 1: ESCÁNER CÁMARA QR -->
    <div class="modal fade" id="modalScanner" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">📷 Escanear Tarjeta / QR</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="cancelarEscaneo()"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="text-muted small">Apunte la cámara hacia el código QR de la tarjeta del alumno</p>
                    <div id="reader" style="width: 100%; max-width: 300px; margin: 0 auto;"></div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary w-100" onclick="cancelarEscaneo()">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN CON PIN (ESTILO .NET / PANTALLA VIRTUAL) -->
    <div class="modal fade" id="modalPin" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">🔐 Validar Transacción</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="cancelarPago()"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="modalAlumnoFoto" src="" class="rounded-circle mb-2 border border-warning"
                        style="width: 90px; height: 90px; object-fit: cover;" alt="Foto Alumno">
                    <h4 class="text-warning mb-1" id="modalAlumnoNombre">Cargando...</h4>
                    <h3 class="text-success mb-3" id="modalMontoCobrar">$ 0</h3>

                    <!-- DISPLAY VIRTUAL PARA DIBUJAR ASTERISCOS (SIN INPUT) -->
                    <div class="mb-3">
                        <div id="displayPin"
                            class="form-control form-control-lg text-center fs-1 bg-black text-warning border-secondary p-2 user-select-none"
                            style="letter-spacing: 6px;">
                            ____
                        </div>
                    </div>

                    <!-- TECLADO NUMÉRICO INTEGRADO PARA PIN -->
                    <div class="row g-2 mb-3">
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('1')">1</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('2')">2</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('3')">3</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('4')">4</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('5')">5</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('6')">6</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('7')">7</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('8')">8</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('9')">9</button></div>
                        <div class="col-4"><button type="button" class="btn btn-danger w-100 py-2 fs-4"
                                onclick="clearPin()">C</button></div>
                        <div class="col-4"><button type="button" class="btn btn-outline-light w-100 py-2 fs-4"
                                onclick="pressPinKey('0')">0</button></div>
                        <div class="col-4"><button type="button" class="btn btn-warning w-100 py-2 fs-4"
                                onclick="deletePinKey()">⌫</button></div>
                    </div>

                    <button type="button" class="btn btn-success btn-lg w-100 fw-bold fs-4 py-3"
                        onclick="confirmarPago()">
                        CONFIRMAR PAGO
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE ÉXITO -->
    <div class="modal fade" id="modalExito" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white border-success">
                <div class="modal-body text-center p-4">
                    <div class="mb-3">
                        <span style="font-size: 4.5rem;">✅</span>
                    </div>
                    <h3 class="text-success fw-bold">¡Pago Aprobado!</h3>
                    <h2 class="display-4 fw-bold text-white my-3" id="exitoMonto">$ 0</h2>
                    <p class="text-muted mb-1">Alumno / Tarjeta:</p>
                    <h5 class="text-warning mb-4" id="exitoAlumno">-</h5>

                    <button type="button" class="btn btn-success btn-lg w-100 fw-bold py-3 fs-5"
                        onclick="cerrarExito()">
                        ACEPTAR / NUEVO COBRO
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/supabaseClient.js"></script>
    <script src="js/posnet.js"></script>
</body>

</html>
