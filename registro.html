<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banco Escolar - Registro de Alumno</title>
  <link rel="stylesheet" href="css/cajero.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="dashboard-container">
    <section class="card card-busqueda" style="max-width: 480px; margin: 0 auto;">
      <h2 style="font-size: 1.4rem; text-align: center;">Alta de Cuenta Alumno</h2>
      <p class="text-subtitle" style="text-align: center; margin-bottom: 15px;">Completá tus datos para crear tu billetera escolar</p>
      
      <form id="formRegistroAlumno">
        <div class="form-group">
          <label for="regDni">DNI / Documento</label>
          <input type="text" id="regDni" placeholder="Ej: 45123456" required>
        </div>

        <div class="form-group">
          <label for="regNombre">Nombre y Apellido</label>
          <input type="text" id="regNombre" placeholder="Ej: Lucas Gómez" required>
        </div>

        <div class="form-group">
          <label for="regCurso">Curso / Grado</label>
          <input type="text" id="regCurso" placeholder="Ej: 6to 2da" required>
        </div>

        <!-- Módulo de Foto -->
        <div class="form-group" style="text-align: center;">
          <label>Foto de Perfil</label>
          <div style="margin: 10px 0;">
            <img id="imgPreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='110' height='110' viewBox='0 0 24 24' fill='none' stroke='%23a0aec0' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'></path><circle cx='12' cy='7' r='4'></circle></svg>" alt="Vista Previa" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #cbd5e0; background: #edf2f7;">
          </div>
          <button type="button" id="btnAbrirCamara" class="btn btn-dark">📷 Tomar Foto con Cámara</button>
        </div>

        <div class="form-group pin-box">
          <label for="regPin">Creá tu PIN de Seguridad (4 dígitos)</label>
          <input type="password" id="regPin" maxlength="4" placeholder="Ej: 1234" required>
        </div>

        <div id="msgRegistro" class="error-message"></div>
        <button type="submit" id="btnGuardar" class="btn btn-primary" style="width:100%; margin-top: 10px;">Crear Mi Cuenta</button>
      </form>
    </section>
  </main>

  <!-- Modal de la Cámara -->
  <div id="modalCamara" class="modal-overlay">
    <div class="modal-content">
      <h3>Capturar Foto</h3>
      <p class="text-subtitle">Mirá a la cámara y presioná el botón</p>
      <video id="webcam" autoplay playsinline style="width: 100%; height: auto; border-radius: 8px; background: #000;"></video>
      <canvas id="canvasFoto" style="display:none;"></canvas>
      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <button id="btnCapturar" class="btn btn-success">Capturar</button>
        <button id="btnCerrarCamara" class="btn btn-danger">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
